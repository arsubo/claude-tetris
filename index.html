<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" aria-pressed="false" title="Cambiar tema">
      <span id="theme-toggle-icon">🌙</span>
    </button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <span class="label">SKIN</span>
          <select id="skin-select" class="skin-select">
            <option value="retro">Retro</option>
            <option value="neon">Neón</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel Art</option>
          </select>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="records-heading">TOP 5 RECORDS</p>
        <table class="records-table" id="start-table">
          <tbody></tbody>
        </table>
        <div class="records-stats">
          <span>Mejor combo: <strong id="start-best-combo">0</strong></span>
          <span>Máx. líneas: <strong id="start-max-lines">0</strong></span>
        </div>
        <button id="play-btn" type="button">Jugar</button>
        <button id="reset-records-btn-start" type="button" class="reset-records-btn">Reiniciar records</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="records-section" class="records-section hidden">
          <form id="score-name-form" class="score-name-form hidden">
            <label for="player-name">¡Nuevo record! Nombre:</label>
            <input type="text" id="player-name" maxlength="12" autocomplete="off" />
            <button type="submit">Guardar</button>
          </form>
          <p class="records-heading">TOP 5 RECORDS</p>
          <table class="records-table" id="game-over-table">
            <tbody></tbody>
          </table>
          <div class="records-stats">
            <span>Mejor combo: <strong id="game-over-best-combo">0</strong></span>
            <span>Máx. líneas: <strong id="game-over-max-lines">0</strong></span>
          </div>
          <button id="reset-records-btn-gameover" type="button" class="reset-records-btn">Reiniciar records</button>
        </div>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
